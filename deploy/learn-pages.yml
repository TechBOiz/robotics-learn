name: Learn site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "learn-site/**"
      - ".github/workflows/learn-pages.yml"
  pull_request:
    paths:
      - "learn-site/**"
      - ".github/workflows/learn-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: learn-site/package-lock.json
      - name: Read Pages settings
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://techboiz.github.io' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/everything-robotics' }}
      - name: Check internal links
        run: npm run check:links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/everything-robotics' }}
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: learn-site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
